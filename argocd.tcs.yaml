apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sinanmohd/tcs-infra.git
    targetRevision: HEAD
    path: appsets
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Prune=confirm
    automated:
      enabled: false
      selfHeal: true
