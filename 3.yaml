# Source: bud/templates/jobs/default-cluster-onboarding.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: bud-default-cluster-onboarding
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "50"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: bud-default-cluster-onboarder
      containers:
        - name: onboarder
          image: curlimages/curl:8.10.1
          env:
            - name: BUDAPP_URL
              value: "http://bud-budapp:9082"
            - name: CLUSTER_NAME
              value: "Control Plane"
            - name: CLUSTER_ICON
              value: "🏠"
            # In-cluster DNS for the Aibrix Envoy data plane. The default-cluster
            # onboarding flow pins the Envoy Service to a stable name (`aibrix-eg-svc`
            # in `envoy-gateway-system`, configured via EnvoyProxy.spec.provider.kubernetes.envoyService
            # in setup_cluster.yaml). budgateway runs in-cluster and reaches Aibrix
            # over this FQDN, so no public LoadBalancer is required.
            - name: INGRESS_URL
              value: "http://aibrix-eg-svc.envoy-gateway-system.svc.cluster.local"
            - name: BUD_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bud-bud-internal-token
                  key: token
            - name: NAMESPACE
              value: "default"
            # Long-lived SA token from the kubernetes.io/service-account-token Secret
            # — survives the Job pod's lifetime so periodic health syncs keep working.
            - name: SA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: bud-default-cluster-onboarder-token
                  key: token
            - name: SA_CA_CRT
              valueFrom:
                secretKeyRef:
                  name: bud-default-cluster-onboarder-token
                  key: ca.crt
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              NS="${NAMESPACE}"
              TOKEN="${SA_TOKEN}"
              CA_B64="$(printf '%s' "${SA_CA_CRT}" | base64 -w 0 2>/dev/null || printf '%s' "${SA_CA_CRT}" | base64 | tr -d '\n')"
              API="https://${KUBERNETES_SERVICE_HOST}:${KUBERNETES_SERVICE_PORT_HTTPS:-${KUBERNETES_SERVICE_PORT}}"

              KUBECONFIG_PATH="$(mktemp)"
              cat > "${KUBECONFIG_PATH}" <<EOF
              apiVersion: v1
              kind: Config
              clusters:
              - name: in-cluster
                cluster:
                  server: ${API}
                  certificate-authority-data: ${CA_B64}
              users:
              - name: bud-default-onboarder
                user:
                  token: ${TOKEN}
              contexts:
              - name: in-cluster
                context:
                  cluster: in-cluster
                  user: bud-default-onboarder
                  namespace: ${NS}
              current-context: in-cluster
              EOF

              # Wait for budapp to be reachable (deployment + Dapr sidecar startup).
              echo "Waiting for budapp at ${BUDAPP_URL} ..."
              for i in $(seq 1 60); do
                if curl -fsS -o /dev/null "${BUDAPP_URL}/health" 2>/dev/null \
                   || curl -fsS -o /dev/null "${BUDAPP_URL}/" 2>/dev/null; then
                  break
                fi
                sleep 5
              done

              echo "Posting in-cluster kubeconfig to budapp ..."
              HTTP_CODE="$(curl -sS -o /tmp/resp.json -w '%{http_code}' \
                -X POST "${BUDAPP_URL}/clusters/_internal/register-default" \
                -H "X-Bud-Internal-Token: ${BUD_INTERNAL_TOKEN}" \
                -F "name=${CLUSTER_NAME}" \
                -F "icon=${CLUSTER_ICON}" \
                -F "ingress_url=${INGRESS_URL}" \
                -F "configuration_file=@${KUBECONFIG_PATH};type=application/yaml;filename=in-cluster.yaml")"
              echo "HTTP ${HTTP_CODE}"
              cat /tmp/resp.json || true
              echo
              # 200 OK = registered or already-registered (idempotent on the server side)
              if [ "${HTTP_CODE}" = "200" ]; then
                exit 0
              fi
              exit 1
