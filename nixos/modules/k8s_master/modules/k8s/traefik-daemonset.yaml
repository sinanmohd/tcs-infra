apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    deployment:
      kind: DaemonSet
    service:
      spec:
        externalTrafficPolicy: Local
    ports:
      web:
        transport:
          respondingTimeouts:
            readTimeout: 900s
            idleTimeout: 900s
      websecure:
        transport:
          respondingTimeouts:
            readTimeout: 900s
            idleTimeout: 900s
