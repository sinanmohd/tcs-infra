apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: ssh://git@github.com/BudEcosystem/bud-runtime
    targetRevision: HEAD
    path: infra/appsets
  destination:
    server: "https://kubernetes.default.svc"
    namespace: "argocd"
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - Prune=confirm
    automated:
      enabled: false
      selfHeal: true
