apiVersion: v2
name: bud
description: Bud Helm chart for Kubernetes
type: application
icon: https://budecosystem.com/logo.svg
version: 1.1.0
appVersion: "1.1.0"
maintainers:
  - name: "sinanmohd"
    email: "sinan@sinanmohd.com"
    url: "https://www.sinanmohd.com"
dependencies:
  # Keycloak is deployed separately via infra/helm/keycloak/ (Operator-based,
  # custom theme image). The bud chart only references admin credentials below.
  - name: novu
    version: 0.1.6
    repository: file://charts/novu
  - name: prometheus
    version: 25.27.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled
  - name: prometheus-adapter
    version: 4.11.0
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus-adapter.enabled
  - name: common
    version: 2.40.0
    repository: https://charts.bitnami.com/bitnami
