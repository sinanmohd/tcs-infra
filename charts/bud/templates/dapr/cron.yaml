apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: governance-endpoint-ref-reconcile
spec:
  type: bindings.cron
  version: v1
  metadata:
  - name: schedule
    # Part B keep-alive + self-heal for the deployment-mirror governance refs; must stay
    # well under the budprompt mirror's L2 TTL (3600s) or governed deployments silently
    # revert to ungoverned on the transparent path.
    value: "@every 10m"
  - name: direction
    value: "input"
  - name: route
    value: "/governance/endpoint-ref-reconcile-cron"
scopes:
  - budapp
