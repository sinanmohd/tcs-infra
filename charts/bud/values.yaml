      BUD_GATEWAY_POOL_TIMEOUT_SECONDS: "30"
      # Durable worker pool, PER WORKER. Per-pod concurrency = uvicornWorkers x WORKER_POOL_SIZE
      # (~90 background runs/s per 2-core pod at a 10s model; CPU-bound, scales with cores/pods).
      WORKER_POOL_SIZE: "256"
      WORKER_CLAIM_BATCH: "32"
      # Idle gap before a full worker re-claims freed slots (also the deadline-sweep interval).
      SWEEP_INTERVAL_SECONDS: "2"
      # Delay before a fresh pod's first claim — small so scale-up isn't stalled.
      WORKER_COLDSTART_JITTER_SECONDS: "3"
      # REQUIRED on the txn pooler: prepared statements are per-backend; 0 = anonymous.
      DB_STATEMENT_CACHE_SIZE: "0"
      # 1800 = code default; short recycles caused a synchronized boot-time reconnect
      # storm through pgbouncer (wedge RCA P4). pre_ping catches stale conns cheaply.
      DB_POOL_RECYCLE_SECONDS: "1800"
      DB_POOL_PRE_PING: "true"
      # Bound every DB wait (wedge RCA P3): a stall becomes a loud error, never a silent park.
      DB_COMMAND_TIMEOUT_SECONDS: "60"
      DB_POOL_TIMEOUT_SECONDS: "30"
      # Bounded valkey pool, PER WORKER (per-pod conns = uvicornWorkers x this).
      REDIS_MAX_CONNECTIONS: "80"
      # Dedups the per-claim gateway api-key bypass SET (else a valkey write storm).
      # MUST stay well below MAX_SUSPENSION_TTL_SECONDS (7d) so the bypass never lapses.
      BYPASS_WRITE_DEDUP_TTL_SECONDS: "3600"
      # OTel semconv resource attrs (spec 004). service.namespace groups all
      # bud services in Tempo/Jaeger; deployment.environment.name is the
      # semconv-native env key; service.version is the image tag so external
      # viewers can pin a trace to a build. The SDK merges these onto every
      # span's Resource.
      OTEL_RESOURCE_ATTRIBUTES: 'service.namespace=bud,deployment.environment.name={{ .Values.environment | default "dev" }},service.version={{ (splitList ":" .Values.microservices.budprompt.image) | last }}'
      # --- Distributed-trace content-capture controls (security / cost) ---
      # DEBUG-FIRST DEFAULTS: full prompt/message/body content IS recorded on spans.
      # For client/multi-tenant or compliance installs, set BUD_TRACE_CAPTURE_CONTENT
      # "false" to STOP recording body/message/history content (ids, sizes, status,
      # errors still recorded). Secret-keyed values (token/authorization/api_key/…) are
      # ALWAYS redacted and bodies ALWAYS size-bounded regardless of this flag.
      BUD_TRACE_CAPTURE_CONTENT: "true"
      BUD_TRACE_BODY_MAX_BYTES: "262144"
      # SDK backstop: hard cap on ANY span-attribute value length (honored by the OTel SDK).
      OTEL_SPAN_ATTRIBUTE_VALUE_LENGTH_LIMIT: "32768"
      # 100% kept (parentbased_always_on). To sample at production scale set
      # "parentbased_traceidratio" + OTEL_TRACES_SAMPLER_ARG "0.25" (errors are not
      # auto-kept by head sampling — prefer collector tail_sampling for that).
      OTEL_TRACES_SAMPLER: "parentbased_always_on"
