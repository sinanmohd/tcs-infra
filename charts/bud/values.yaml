      budgateway: "bud_gateway"
      budmetrics: "metrics"
  oidc:
    url: "http://auth.bud.lan/realms/bud-keycloak"
    clients:
      mcpgateway:
        id: mcp-gateway
        secret: mcp-gateway
  # Keycloak server itself (base URL, no /realms suffix). The per-env SOPS secrets
  # file already overlays url and clients.mcpgateway.secret; these are the defaults.
  # Consumed by the mcpgateway deployment for its SSO_KEYCLOAK_* provider, which
  # needs the base URL + realm split (issuer discovery + role sync) rather than the
  # combined realm URL that the generic OIDC block uses.
  keycloak:
    url: "http://auth.bud.lan"
    realm: "bud-keycloak"
    clients:
