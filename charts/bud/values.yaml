  budgateway:
    enabled: true
    image: registry.bud.studio/runtime/budgateway:1.1.2
    env:
      # Distributed-trace content capture (see microservices.budprompt.env for the full note).
      # DEBUG-FIRST: full LLM request/response bodies + messages recorded on spans by default.
      # Set BUD_TRACE_CAPTURE_CONTENT "false" for client/compliance installs to stop recording
      # body/message content. Secret-keyed values ALWAYS redacted; bodies ALWAYS size-bounded
      # (the gateway has no SDK value-length limit, so this app-side cap is the only backstop).
      BUD_TRACE_CAPTURE_CONTENT: "true"
      BUD_TRACE_BODY_MAX_BYTES: "262144"
      # WP-3.4 (FR-CTX-170): trusted request-attribute allowlist — header names
      # (case-insensitive) the gateway remove-then-injects and stamps as `headers.*`
      # governance facts. ONE source, kept in sync with the budprompt and budapp
      # TRUSTED_REQUEST_ATTRIBUTES env (NFR-270). Empty ⇒ no client header trusted.
    nodeSelector: {}
    affinity: {}
    resources:
      requests:
        cpu: "1"
        memory: 2Gi
      limits:
        cpu: "4"
        memory: 8Gi
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
      # Custom-metric autoscaling DISABLED — the gateway scales on CPU/memory only.
      # The gateway_processing_seconds_p95 metric mis-scaled the gateway to max
      # replicas on any traffic, for two reasons:
      #   1. targetValue "2m" is parsed by Kubernetes as 2 milli-units (0.002s),
      #      NOT 2 minutes — so the real p95 (~300-500ms) always exceeded it.
      #   2. gateway_processing_seconds is dominated by the synchronous
      #      semantic-router hop (pre-model latency the gateway can't fix by
      #      adding replicas), so it was never a gateway-saturation signal.
      # Load testing to 8000 concurrent confirmed CPU/memory (memory-bound for this
      # connection-holding gateway) scales it correctly 1->9 pods with no OOM/crash.
      prometheusMetrics:
        enabled: false
        metricName: gateway_processing_seconds_p95
        targetValue: "2m"
      scaleDownStabilizationSeconds: 300
      scaleUpStabilizationSeconds: 0
  budsentinel:
    enabled: true
    image: registry.bud.studio/runtime/sentinel:nightly
    env:
      # Export guardrail spans + metrics to the shared OTel collector, in sync with
      # the rest of the stack (collector -> ClickHouse -> budmetrics). Sentinel's
      # exporter is OTLP/gRPC only, so it targets :4317 (like budgateway), not :4318.
      BUD_OTEL_ENABLED: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://{{ $.Release.Name }}-otel-collector:4317"
    nodeSelector: {}
    affinity: {}
    resources:
