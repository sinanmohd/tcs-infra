# Admin credentials for the Operator-managed Keycloak (deployed via
# infra/helm/keycloak/). Must match the values supplied to that chart.
# Custom theme + per-env logo overlay are configured there too.
# OpenTelemetry Collector for metrics collection
# Dapr distributed tracing (spec 004-observability-otel-refactor, Task 3).
# OFF by default: Dapr sidecars currently log traces to stdout only, so
# service-invocation / pub-sub hops do NOT join the OTel trace graph. Setting
# enabled=true renders templates/dapr/tracing-configuration.yaml which points
# the Dapr OTLP exporter at the in-cluster collector. To actually opt a
# service in you must ALSO add `dapr.io/config: <release>-tracing` to that
# service's pod annotations (deferred rollout — see the template header).
# W3C tracecontext + bud.* baggage propagation is independent of this flag.
daprTracing:
  enabled: false
  samplingRate: "1"
otelCollector:
  enabled: true
  image:
    repository: otel/opentelemetry-collector-contrib
    tag: 0.151.0
  replicas: 1
  logLevel: info
  debug: false
  batchSize: 10000
  batchTimeout: 10s
  memoryLimit: 2048
  memorySpikeLimit: 512
  resources:
    requests:
      memory: 262Mi
    limits:
      memory: 1Gi
  clickhouse:
    host: clickhouse
    port: 9000
    database: metrics
    username: default
    password: ""
    ttl: 720h
  groupByTrace:
    waitDuration: 5s
    numTraces: 1000000
    numWorkers: 2
  realtime:
    batchTimeout: 2s
    batchSize: 10000
  # EXTERNAL trace export (Phase 1 — spec 004-observability-otel-refactor).
  # Ships a SECOND copy of spans to the external LGTM/Tempo OTLP sink so
  # cross-service traces are viewable in Tempo/Jaeger. On this pipeline ONLY,
  # message-content (gen_ai.input/output.messages, system.instructions) and
  # request/response header attributes are DELETED before egress. The
  # ClickHouse cold path is untouched and keeps full content for Phase-2.
  #
  # endpoint: gRPC OTLP address of the Tempo distributor. The LGTM stack is
  # NOT part of this chart — set this to wherever Tempo is reachable in the
  # target cluster (e.g. tempo / tempo-distributor in the observability ns).
  # Disabled by default so installs without an external sink keep rendering a
  # valid collector config (only the ClickHouse + realtime pipelines run).
  externalExport:
    enabled: false
    endpoint: "tempo.observability.svc.cluster.local:4317"
    tls:
      insecure: true
    # Optional static headers for the OTLP exporter (e.g. tenant id / auth).
    headers: {}
  # Optional node scheduling for OTel Collector
  nodeSelector: {}
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 75
          preference:
            matchExpressions:
              - key: bud.studio/control-plane
                operator: In
                values:
                  - "true"
prometheus:
  enabled: true
  alertmanager:
    enabled: false
  kube-state-metrics:
    enabled: false
  prometheus-node-exporter:
    enabled: false
  prometheus-pushgateway:
    enabled: false
  server:
    persistentVolume:
      storageClass: ""
    retention: "2h"
    resources:
      requests:
        memory: 881Mi
      limits:
        memory: 16Gi
    nodeSelector: {}
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 75
            preference:
              matchExpressions:
                - key: bud.studio/control-plane
                  operator: In
                  values:
                    - "true"
  # WP-2.10 (NFR-240): chart-default governance HITL alert rules (tunable). Fire on approver-bottleneck
  # (pending backlog age > TTL/2), sustained TTL expiries, and rubber-stamp auto-approval share > 90%/24h.
  serverFiles:
    alerting_rules.yml:
      groups:
        - name: governance-hitl
          rules:
            - alert: GovernanceEscalationBacklogAgeHigh
              # pending backlog age p95 approaching half the default escalation TTL (259200s / 2).
              expr: histogram_quantile(0.95, sum(rate(governance_escalation_resolution_seconds_bucket[1h])) by (le)) > 129600
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Governance escalation resolution p95 exceeds TTL/2 (approver bottleneck)"
            - alert: GovernanceEscalationsExpiring
              # any sustained TTL-expiry rate means approvers are not keeping up (safe-default firing).
              expr: sum(rate(governance_escalations_expired_total[15m])) > 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Governance escalations are expiring on TTL (safe-default applied)"
            - alert: GovernanceStandingGrantRubberStamp
              # auto-approval share of a policy's escalations > 90% over 24h ⇒ review whether it should be notify.
              expr: |
                sum(increase(governance_standing_grant_auto_approvals_total[24h])) by (policy_id)
                / clamp_min(sum(increase(governance_verdicts_total{verdict="escalate"}[24h])) by (policy_id), 1) > 0.9
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: "Standing-grant auto-approval share > 90% over 24h (rubber-stamp anomaly)"
    # (master) Drop the subchart's default cluster-wide scrape jobs (apiserver/etcd histograms + NFD
    # node-label explosion) that bloat this HPA-only Prometheus to 10GB+; keep only self +
    # kubernetes-pods (app jobs append via extraScrapeConfigs). Replaces scrape_configs only; the
    # serverFiles map merges, so alerting_rules.yml (above) survives.
    prometheus.yml:
      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets:
                - localhost:9090
        - honor_labels: true
          job_name: kubernetes-pods
          kubernetes_sd_configs:
            - role: pod
          relabel_configs:
            - action: keep
              regex: true
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scrape
            - action: drop
              regex: true
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scrape_slow
            - action: replace
              regex: (https?)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_scheme
              target_label: __scheme__
            - action: replace
              regex: (.+)
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_path
              target_label: __metrics_path__
            - action: replace
              regex: (\d+);(([A-Fa-f0-9]{1,4}::?){1,7}[A-Fa-f0-9]{1,4})
              replacement: "[$2]:$1"
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: replace
              regex: (\d+);((([0-9]+?)(\.|$)){4})
              replacement: $2:$1
              source_labels:
                - __meta_kubernetes_pod_annotation_prometheus_io_port
                - __meta_kubernetes_pod_ip
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_annotation_prometheus_io_param_(.+)
              replacement: __param_$1
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - action: replace
              source_labels:
                - __meta_kubernetes_namespace
              target_label: namespace
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_name
              target_label: pod
            - action: drop
              regex: Pending|Succeeded|Failed|Completed
              source_labels:
                - __meta_kubernetes_pod_phase
            - action: replace
              source_labels:
                - __meta_kubernetes_pod_node_name
              target_label: node
  extraScrapeConfigs: |
    - job_name: 'budgateway'
      scrape_interval: 1s
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: .*-budgateway
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "3000"
          action: keep
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    - job_name: 'semantic-router'
      scrape_interval: 15s
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: .*-semantic-router
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "9190"
          action: keep
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
    - job_name: 'budprompt'
      scrape_interval: 5s
      kubernetes_sd_configs:
        - role: pod
      relabel_configs:
        - source_labels: [__meta_kubernetes_pod_label_app]
          regex: .*-budprompt
          action: keep
        - source_labels: [__meta_kubernetes_pod_container_port_number]
          regex: "3015"
          action: keep
        - source_labels: [__meta_kubernetes_namespace]
          target_label: namespace
        - source_labels: [__meta_kubernetes_pod_name]
          target_label: pod
prometheus-adapter:
  enabled: true
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 75
          preference:
            matchExpressions:
              - key: bud.studio/control-plane
                operator: In
                values:
                  - "true"
  prometheus:
    url: "http://{{ $.Release.Name }}-prometheus-server"
    port: 80
  rules:
    custom:
      - seriesQuery: 'gateway_processing_seconds{quantile="0.95"}'
        resources:
          overrides:
            pod: { resource: "pod" }
            namespace: { resource: "namespace" }
        name:
          as: "gateway_processing_seconds_p95"
        metricsQuery: 'gateway_processing_seconds{quantile="0.95",<<.LabelMatchers>>}'
      - seriesQuery: "llm_model_queue_depth_estimated"
        resources:
          overrides:
            pod: { resource: "pod" }
            namespace: { resource: "namespace" }
        name:
          as: "sr_in_flight_requests"
        metricsQuery: "sum without (model) (llm_model_queue_depth_estimated{<<.LabelMatchers>>})"
      - seriesQuery: "budprompt_inflight_requests"
        resources:
          overrides:
            pod: { resource: "pod" }
            namespace: { resource: "namespace" }
        name:
          as: "budprompt_inflight_requests"
        metricsQuery: "sum(budprompt_inflight_requests{<<.LabelMatchers>>}) by (<<.GroupBy>>)"
