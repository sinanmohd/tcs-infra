apiVersion: v2

name: cert-manager
description: A Helm chart for cert-manager
type: application
version: 0.1.3

maintainers:
  - name: "sinanmohd"
    email: "sinan@sinanmohd.com"
    url: "https://www.sinanmohd.com"

dependencies:
  - name: cert-manager
    version: 1.21.0
    repository: oci://quay.io/jetstack/charts
    condition: cert-manager.enabled
  - name: trust-manager
    version: 0.24.0
    repository: oci://quay.io/jetstack/charts
    condition: trust-manager.enabled
