clusterPolicies:
  inject-selfsigned-ca:
    background: false
    rules:
      - name: inject-selfsigned-ca
        match:
          any:
            - resources:
                namespaces:
                  - bud
                kinds:
                  - Pod
        mutate:
          foreach:
            - list: request.object.spec.containers
              patchStrategicMerge:
                spec:
                  volumes:
                    - name: tcs-ca
                      configMap:
                        name: tcs
                  containers:
                    - name: "{{ element.name }}"
                      volumeMounts:
                        - name: tcs-ca
                          mountPath: /etc/ssl/certs
                          subPath: tcs-ca.pem
                          readOnly: true
                        # - name: selfsigned-with-default-ca
                        #   mountPath: /etc/ssl/certs/tcs-ca.pem
                        #   subPath: tcs-ca.pem
                        #   readOnly: true
                      env:
                        - name: SSL_CERT_FILE
                          value: "/etc/ssl/certs/tcs-ca.pem"
                        - name: NODE_EXTRA_CA_CERTS
                          value: "/etc/ssl/certs/tcs-ca.pem"
                        - name: REQUESTS_CA_BUNDLE
                          value: "/etc/ssl/certs/tcs-ca.pem"
