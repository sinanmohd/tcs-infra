ingress:
  https: true
  host: auth.intel.bud-demo.com

realms:
  keycloak-bud-keycloak-realm:
    clients:
      budadmin-web:
        attributes:
          post.logout.redirect.uris: https://admin.intel.bud-demo.com
        redirectUris:
          - https://app.intel.bud-demo.com/auth/redirect/callback
      budcustomer-web:
        attributes:
          post.logout.redirect.uris: https://admin.intel.bud-demo.com##https://customer.intel.bud-demo.com##https://playground.intel.bud-demo.com
        redirectUris:
          - https://app.intel.bud-demo.com/auth/redirect/callback
          # Customer-app root: allow-lists KEYCLOAK_CUSTOMER_ACTION_REDIRECT_URI so a CLIENT
          # user's invite/reset "set password" flow can redirect into the customer portal.
          - https://customer.intel.bud-demo.com/*
      budplayground-web:
        attributes:
          post.logout.redirect.uris: https://playground.intel.bud-demo.com
        redirectUris:
          - https://app.intel.bud-demo.com/auth/redirect/callback
      mcp-gateway:
        attributes:
          post.logout.redirect.uris: https://admin.intel.bud-demo.com##https://customer.intel.bud-demo.com##https://playground.intel.bud-demo.com
        redirectUris:
          - https://app.intel.bud-demo.com/auth/redirect/callback
